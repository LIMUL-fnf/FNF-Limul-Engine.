          name: macBuild
          path: export/release/macos/bin

  buildAndroid:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7

      - name: Install Haxelib
        shell: bash
        run: |
          set -o pipefail
          {
            haxelib setup ~/haxelib
            haxelib install hxcpp 4.3.2 > /dev/null
            haxelib install lime 8.3.2
            haxelib install openfl 9.5.2
            haxelib install flixel 5.5.0
            haxelib run lime setup flixel
            haxelib run lime setup
            haxelib install flixel-tools
            haxelib install flixel-ui 2.4.0
            haxelib install flixel-addons 2.11.0
            haxelib git flxanimate https://github.com/Dot-Stuff/flxanimate v4.0.0
            haxelib install hscript 2.7.0
            haxelib git hscript-ex https://github.com/ianharrigan/hscript-ex
            haxelib set flixel 5.5.0
            haxelib set flixel-ui 2.4.0
            haxelib set flixel-addons 2.11.0
            haxelib list
          } 2>&1 | tee install-haxelib.log
          echo "::notice::$(haxelib list | grep -E '^flixel(-ui|-addons)?:' | tr '\n' ' ')"

      - name: Set up Android SDK and NDK
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;25.2.9519653" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_SDK=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"
          # Lime refuses the Android target until its config has ANDROID_SETUP; the SDK/NDK paths
          # above already cover what the interactive "lime setup android" would ask for.
          echo "ANDROID_SETUP=true" >> "$GITHUB_ENV"

      - name: Generate signing key
        shell: bash
        run: |
          keytool -genkeypair -keystore ci-keystore.jks -storetype JKS \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias limul -storepass limul-engine -keypass limul-engine \
            -dname "CN=Limul Engine, OU=Limul, O=Limul, C=PL"

      - name: Create Version Tag
        run: echo "${{github.run_id}}" > VERSION

      - name: Compile
        shell: bash
        run: |
          # hxcpp 4.3.2 guesses the NDK host dir as "linux-x86" and misses the real
          # toolchains/llvm/prebuilt/linux-x86_64 bin, falling back to the runner's system
          # clang, which has no Android C++ headers ("typeinfo file not found").
          haxelib run lime build project.xml android -DANDROID_HOST=linux-x86_64 \
            --certificate-path=ci-keystore.jks \
            --certificate-password=limul-engine \
            --certificate-alias=limul \
            --certificate-alias-password=limul-engine 2>&1 | tee build.log

      - name: Show logs on failure
        if: failure()
        shell: bash
        run: |
          f=build.log; [ -f "$f" ] || f=install-haxelib.log
          { echo "### $f (tail)"; echo '```'; tail -n 120 "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # hxcpp's "Compiling group" listing includes file names like Error.cpp that match a
          # naive grep; drop that noise and always append the log tail so the real failure
          # reaches one annotation instead of being crowded out.
          hits=$(grep -E "error:|Error:|fatal error|undefined reference|Could not|Exception|Invalid|not found|FAILED" "$f" | grep -vE "^ - |\[haxe,release\]" | head -n 6 || true)
          msg=$( { printf '%s\n' "$hits"; echo '--- tail ---'; tail -n 8 "$f"; } | tr '\n' '~' )
          msg=$(printf '%s' "$msg" | sed 's/%/%25/g' | cut -c1-6000)
          printf '::error::%s\n' "$msg"

      - name: Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: androidBuild
          path: 'export/release/android/bin/app/build/outputs/apk/release/*.apk'
