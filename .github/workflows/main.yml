# Builds the engine for Linux, Windows, macOS and Android on every push and pull request.

name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  buildLinux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7

      - name: Install Haxelib
        shell: bash
        run: |
          set -o pipefail
          {
            haxelib setup ~/haxelib
            haxelib install hxcpp 4.3.2 > /dev/null
            haxelib install lime 8.3.2
            haxelib install openfl 9.5.2
            haxelib install flixel 5.5.0
            haxelib run lime setup flixel
            haxelib run lime setup
            haxelib install flixel-tools
            haxelib install flixel-ui 2.4.0
            haxelib install flixel-addons 2.11.0
            haxelib install tjson
            haxelib install hxjsonast
            haxelib install hxCodec 2.5.1
            haxelib git flxanimate https://github.com/Dot-Stuff/flxanimate v4.0.0
            haxelib git linc_luajit https://github.com/nebulazorua/linc_luajit
            haxelib install hscript 2.7.0
            haxelib git hscript-ex https://github.com/ianharrigan/hscript-ex
            haxelib git discord_rpc https://github.com/Aidan63/linc_discord-rpc
            haxelib install hxcpp-debug-server
            haxelib set flixel 5.5.0
            haxelib set flixel-ui 2.4.0
            haxelib set flixel-addons 2.11.0
            haxelib list
          } 2>&1 | tee install-haxelib.log
          echo "::notice::$(haxelib list | grep -E '^flixel(-ui|-addons)?:' | tr '\n' ' ')"

      - name: Patch rapidjson (discord_rpc)
        shell: bash
        run: |
          cd ~/haxelib/discord_rpc/git
          git submodule update --init --recursive
          python3 - <<'PY'
          import pathlib, re
          base = pathlib.Path.home() / "haxelib/discord_rpc/git"
          pat = re.compile(r"GenericStringRef&\s+operator=\(const GenericStringRef&\s+rhs\)\s*\{[^}]*\}")
          for rel in ("lib/rapidjson/include/rapidjson/document.h", "lib/discord-rpc/include/rapidjson/document.h"):
              p = base / rel
              if not p.exists():
                  print("skip (missing):", rel)
                  continue
              s = p.read_text()
              s2, n = pat.subn("GenericStringRef& operator=(const GenericStringRef& rhs) = delete;", s)
              if n:
                  p.write_text(s2)
              print("patched:", n, rel)
          PY
          grep -R "length = rhs.length" ~/haxelib/discord_rpc/git/lib/*/include/rapidjson/document.h && exit 1 || true

      - name: Create Version Tag
        run: echo "${{github.run_id}}" > VERSION

      - name: Compile
        shell: bash
        run: haxelib run lime build project.xml linux 2>&1 | tee build.log

      - name: Show logs on failure
        if: failure()
        shell: bash
        run: |
          f=build.log; [ -f "$f" ] || f=install-haxelib.log
          { echo "### $f (tail)"; echo '```'; tail -n 120 "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # hxcpp's "Compiling group" listing includes file names like Error.cpp that match a
          # naive grep; drop that noise and always append the log tail so the real failure
          # reaches one annotation instead of being crowded out.
          hits=$(grep -E "error:|Error:|fatal error|undefined reference|Could not|Exception|Invalid|not found|FAILED" "$f" | grep -vE "^ - |\[haxe,release\]" | head -n 6 || true)
          msg=$( { printf '%s\n' "$hits"; echo '--- tail ---'; tail -n 8 "$f"; } | tr '\n' '~' )
          msg=$(printf '%s' "$msg" | sed 's/%/%25/g' | cut -c1-6000)
          printf '::error::%s\n' "$msg"

      - name: Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linuxBuild
          path: 'export/release/linux/bin'

  buildWindows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7

      - name: Install Haxelib
        shell: cmd
        run: |
          (
            haxelib setup C:/haxelib || exit /b 1
            haxelib install hxcpp 4.3.2 > nul || exit /b 1
            haxelib install lime 8.3.2 || exit /b 1
            haxelib install openfl 9.5.2 || exit /b 1
            haxelib install flixel 5.5.0 || exit /b 1
            haxelib run lime setup flixel || exit /b 1
            haxelib run lime setup || exit /b 1
            haxelib install flixel-tools || exit /b 1
            haxelib install flixel-ui 2.4.0 || exit /b 1
            haxelib install flixel-addons 2.11.0 || exit /b 1
            haxelib install tjson || exit /b 1
            haxelib install hxjsonast || exit /b 1
            haxelib install hxCodec 2.5.1 || exit /b 1
            haxelib git flxanimate https://github.com/Dot-Stuff/flxanimate v4.0.0 || exit /b 1
            haxelib git linc_luajit https://github.com/nebulazorua/linc_luajit || exit /b 1
            haxelib install hscript 2.7.0 || exit /b 1
            haxelib git hscript-ex https://github.com/ianharrigan/hscript-ex || exit /b 1
            haxelib git discord_rpc https://github.com/Aidan63/linc_discord-rpc || exit /b 1
            haxelib install hxcpp-debug-server || exit /b 1
            haxelib set flixel 5.5.0 || exit /b 1
            haxelib set flixel-ui 2.4.0 || exit /b 1
            haxelib set flixel-addons 2.11.0 || exit /b 1
            haxelib list || exit /b 1
          ) > install-haxelib.log 2>&1
          for /f "delims=" %%L in ('haxelib list ^| findstr /b "flixel"') do echo ::notice::%%L

      - name: Create Version Tag
        shell: cmd
        run: echo "${{github.run_id}}" > VERSION

      - name: Compile
        shell: cmd
        run: |
          haxelib run lime build project.xml windows > build.log 2>&1
          if errorlevel 1 exit /b 1

      - name: Show logs on failure
        if: failure()
        shell: pwsh
        run: |
          $f = if (Test-Path 'build.log') { 'build.log' } else { 'install-haxelib.log' }
          Add-Content $env:GITHUB_STEP_SUMMARY "### $f (tail)"
          Add-Content $env:GITHUB_STEP_SUMMARY '```'
          Get-Content $f -Tail 120 | Add-Content $env:GITHUB_STEP_SUMMARY
          Add-Content $env:GITHUB_STEP_SUMMARY '```'
          $lines = Select-String -Path $f -Pattern 'error:|Error:|fatal error|undefined reference|Could not|Exception|Invalid|not found|FAILED' |
            Where-Object { $_.Line -notmatch '^\s*- ' -and $_.Line -notmatch '\[haxe,release\]' } |
            Select-Object -First 6 | ForEach-Object { $_.Line }
          $msg = (@($lines) + @('--- tail ---') + @(Get-Content $f -Tail 8)) -join '~'
          if ($msg.Length -gt 6000) { $msg = $msg.Substring(0, 6000) }
          $msg = $msg -replace '%', '%25'
          Write-Output "::error::$msg"

      - name: Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windowsBuild
          path: export/release/windows/bin

  buildMac:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7

      - name: Install Haxelib
        shell: bash
        run: |
          set -o pipefail
          {
            haxelib setup ~/haxelib
            haxelib install hxcpp 4.3.2 > /dev/null
            haxelib install lime 8.3.2
            haxelib install openfl 9.5.2
            haxelib install flixel 5.5.0
            haxelib run lime setup flixel
            haxelib run lime setup
            haxelib install flixel-tools
            haxelib install flixel-ui 2.4.0
            haxelib install flixel-addons 2.11.0
            haxelib install tjson
            haxelib install hxjsonast
            haxelib install hxCodec 2.5.1
            haxelib git flxanimate https://github.com/Dot-Stuff/flxanimate v4.0.0
            haxelib git linc_luajit https://github.com/nebulazorua/linc_luajit
            haxelib install hscript 2.7.0
            haxelib git hscript-ex https://github.com/ianharrigan/hscript-ex
            haxelib git discord_rpc https://github.com/Aidan63/linc_discord-rpc
            haxelib install hxcpp-debug-server
            haxelib set flixel 5.5.0
            haxelib set flixel-ui 2.4.0
            haxelib set flixel-addons 2.11.0
            haxelib list
          } 2>&1 | tee install-haxelib.log
          echo "::notice::$(haxelib list | grep -E '^flixel(-ui|-addons)?:' | tr '\n' ' ')"

      - name: Patch rapidjson (discord_rpc)
        shell: bash
        run: |
          cd ~/haxelib/discord_rpc/git
          git submodule update --init --recursive
          python3 - <<'PY'
          import pathlib, re
          base = pathlib.Path.home() / "haxelib/discord_rpc/git"
          pat = re.compile(r"GenericStringRef&\s+operator=\(const GenericStringRef&\s+rhs\)\s*\{[^}]*\}")
          for rel in ("lib/rapidjson/include/rapidjson/document.h", "lib/discord-rpc/include/rapidjson/document.h"):
              p = base / rel
              if not p.exists():
                  print("skip (missing):", rel)
                  continue
              s = p.read_text()
              s2, n = pat.subn("GenericStringRef& operator=(const GenericStringRef& rhs) = delete;", s)
              if n:
                  p.write_text(s2)
              print("patched:", n, rel)
          PY
          grep -R "length = rhs.length" ~/haxelib/discord_rpc/git/lib/*/include/rapidjson/document.h && exit 1 || true

      - name: Create Version Tag
        run: echo "${{github.run_id}}" > VERSION

      - name: Compile
        shell: bash
        run: haxelib run lime build project.xml mac 2>&1 | tee build.log

      - name: Show logs on failure
        if: failure()
        shell: bash
        run: |
          f=build.log; [ -f "$f" ] || f=install-haxelib.log
          { echo "### $f (tail)"; echo '```'; tail -n 120 "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # hxcpp's "Compiling group" listing includes file names like Error.cpp that match a
          # naive grep; drop that noise and always append the log tail so the real failure
          # reaches one annotation instead of being crowded out.
          hits=$(grep -E "error:|Error:|fatal error|undefined reference|Could not|Exception|Invalid|not found|FAILED" "$f" | grep -vE "^ - |\[haxe,release\]" | head -n 6 || true)
          msg=$( { printf '%s\n' "$hits"; echo '--- tail ---'; tail -n 8 "$f"; } | tr '\n' '~' )
          msg=$(printf '%s' "$msg" | sed 's/%/%25/g' | cut -c1-6000)
          printf '::error::%s\n' "$msg"

      - name: Publish Artifact
        uses: actions/upload-artifact@v4
